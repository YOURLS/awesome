# Known plugins.
#
# Plugin fields:
#   name         (required) UNIQUE plugin name
#   url          (required) canonical direct link with https
#   description  (required) one line, starts with a capital, ends with a period, less than 200 characters.
#   category     (required) exactly one slug from the `categories` block below.
#   tags         (optional) free-text keywords, lowercase, at most 5, each being at most 30 chars.
#                Not rendered in the README, only on https://awesome.yourls.org
#                Tips:
#                - Re-use existing rather than making your own: it makes the search more useful and the plugin more discoverable.
#                - Make them useful to a user searching, it should be what a user would actually type.
#                - No generic words like "plugin", "yourls", "shortener".
#   official     (optional) true = authored by a YOURLS team member  -> badge
#   tested       (optional) true = ships its own unit tests          -> badge
#

categories:
  - slug: links
    label: Link creation, keywords & metadata
    description: "Anything changing how a short URL comes into existence: accepted characters, length, case, protocols, or how the long URL and its title are fetched and stored."

  - slug: redirection
    label: Redirection & link behaviour
    description: "Anything changing what happens when a short URL is visited: status code, destination, query string handling, or what a visitor gets when the keyword does not exist."

  - slug: auth
    label: Authentication, users & access control
    description: "Anything governing who can log in, how they authenticate, or what they may see and do once inside."

  - slug: security
    label: Anti-spam, security, privacy & moderation
    description: "Anything blocking abusive submissions, checking destinations against a reputation service, restricting what may be shortened, or reducing the personal data YOURLS keeps and leaks."

  - slug: stats
    label: Statistics, logs & analytics
    description: "Anything collecting, filtering, enriching or displaying click data, or forwarding it to an external analytics platform."

  - slug: api
    label: API
    description: "Anything whose purpose is the HTTP API itself: new actions, new output formats, new authentication for API calls."

  - slug: admin
    label: Admin interface
    description: "Anything reshaping the look, language, navigation or built-in tooling of the admin area, without changing how links themselves behave."

  - slug: infrastructure
    label: Database, cache, performance & infrastructure
    description: "Anything changing where data is stored, how it is cached, or how YOURLS fits into its hosting environment."

  - slug: sharing
    label: Sharing & notifications
    description: "Anything pushing a short URL or an event about it somewhere else: a share button for a human, or an automated message to a service."

  - slug: preview
    label: Preview, QR codes & thumbnails
    description: "Anything rendering a visual artefact for a short URL, or showing an interstitial page before the redirection happens."

  - slug: bulk
    label: Bulk operations & link lifecycle
    description: "Anything acting on many links at once, or managing what happens to a link over time: expiry, pruning, repair, health checks."

  - slug: public-pages
    label: Public pages, content & files
    description: "Anything adding a user-facing page served by YOURLS beyond the plain redirection: a public shortener form, a landing page, a contact form, or file hosting."

  - slug: monetization
    label: Monetization & affiliation
    description: "Anything inserting affiliate parameters, or routing the redirection through an advertising service."

  - slug: development
    label: Development & debugging
    description: "Anything meant for a development, test or staging install, or helping diagnose an existing one. Not intended for production."

  - slug: misc
    label: Misc / Others / Unsorted
    description: "Everything that does not fit yet. A waiting room, not a dumping ground: once 4 or more entries here share a theme, they get a category of their own."

