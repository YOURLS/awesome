# Community guides and tutorials.
#
# Stuff to read: blog posts, articles, videos.
# Something you install or run goes in data/deployments.yml, not here.
#
# Flat list: the generator does the grouping (see for instance the various "platform: Ubuntu" entries)
# Entries with a `lang` other than `en` move to their own sub-section.
#
# Fields:
#   title     (required)
#   url       (required)
#   category  (required) one of the slugs in the `categories` block below
#   platform  (optional) OS, panel or host the guide targets
#   lang      (optional) two letters ISO code, other than `en`

categories:
  - slug: install
    label: Installation guides
    description: Getting YOURLS running by hand, platform by platform.
  - slug: tutorial
    label: Other tutorials
    description: Everything else the community has written about YOURLS.

