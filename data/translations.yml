# YOURLS localizations.
#
# One entry per language, not per repository: a language can be maintained in several places (see Portuguese below).
#
# Fields:
#   language  (required) English name of the language, with the variant in parentheses when relevant
#   locale    (required) locale code as used by YOURLS, `xx_XX`
#   native    (required) the language's own name, shown next to the English name on awesome.yourls.org
#   urls      (required) one or more entries, each with a url, an optional note, and an optional label.
#             With no `label` set, the @account name taken from the url is used.

translations:

  - language: Bulgarian
    native: Български
    locale: bg_BG
    urls:
      - url: https://github.com/VoodooServ/YOURLS-bg_BG

