name: Rebuild README

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'bin/**'
      - 'README.template.md'
  workflow_dispatch:

concurrency:
  group: rebuild-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          # Left in .git/config, so the push at the end of this job uses it too.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # A bad merge should not produce a garbage README.
      - name: Validate the data files
        run: python3 bin/validate.py --quiet

      - name: Regenerate
        run: python3 bin/generate_readme.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo 'README.md is already up to date, nothing to commit.'
            exit 0
          fi
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Regenerate README from data/'
          # Another merge may have landed while this job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
