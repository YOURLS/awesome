name: Check all links

on:
  schedule:
    # Once a month, at 13:13 UTC on the first day of the month.
    - cron: '13 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cache is used if possible (eg close workflow_dispatch runs)
      - name: Lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # The report goes to the job summary.
      - name: Check every link
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 2
            --timeout 20
            --max-concurrency 8
            --exclude '^https?://(sho\.rt|your\.site|long\.url)'
            --accept 200,206,403,429,530
            -v
            data/*.yml
          # Never fails: dead links are maintenance work, not a broken build.
          fail: false
